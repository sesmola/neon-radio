name: neon_radio
description: Neon temalı canlı radyo + DJ yayın uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2            # Durum yönetimi
  just_audio: ^0.9.40         # Stream oynatıcı (ICY metadata destekli)
  audio_service: ^0.18.15     # Arka plan + kilit ekranı kontrolleri
  audio_session: ^0.1.21
  shared_preferences: ^2.3.2  # Giriş, favoriler, ayarlar
  flutter_webrtc: ^0.11.7     # DJ modu: mikrofon -> WebRTC (WHIP)
  http: ^1.2.2
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8       # Yayın sırasında ekran/CPU uyanık

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
